[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "school-ai"
version = "0.2.0"
description = "Локальный RAG по документам школы: Ollama + PostgreSQL/pgvector"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
school-ai = "school_ai.cli:main"

[tool.setuptools.packages.find]
include = ["school_ai*"]

[tool.setuptools.package-data]
school_ai = ["sql/*.sql", "web/static/*"]
